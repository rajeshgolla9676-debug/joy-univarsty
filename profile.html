<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile | Student Portal</title><link rel="stylesheet" href="assets/css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script defer src="assets/js/app.js"></script></head><body data-page="profile"><header class="top"><a class="brand" href="dashboard.html">J <span>Student Portal</span></a><nav><a href="dashboard.html">Dashboard</a><button class="btn ghost" data-logout>Log out</button></nav></header><main class="wrap app narrow"><p class="eyebrow">ACCOUNT SETTINGS</p><h1>My profile</h1><p class="muted">Student ID and email are controlled separately and cannot be edited here.</p><form id="profile-form" class="panel"><div id="message" class="message"></div><label>Full name<input name="full_name" required></label><label>Student ID<input name="student_id" disabled></label><label>Email<input name="email" disabled></label><label>Department<select name="department" required><option>Computer Science and Engineering</option><option>Artificial Intelligence and Data Science</option><option>Information Technology</option><option>Electronics and Communication Engineering</option><option>Mechanical Engineering</option><option>Civil Engineering</option><option>Other</option></select></label><label>Degree / course<input name="course" required></label><label>Academic year<select name="academic_year" required><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>Other</option></select></label><label>Phone<input name="phone" type="tel"></label><button class="btn" type="submit">Save changes</button> <a class="btn ghost" href="dashboard.html">Cancel</a></form></main></body></html>
