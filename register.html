<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Student Portal</title><link rel="stylesheet" href="assets/css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script defer src="assets/js/app.js"></script></head><body><a class="back" href="index.html">← Home</a><main class="auth"><section class="intro"><p class="eyebrow">STUDENT PORTAL</p><h1>Create your<br>student account.</h1><p class="muted">Your password is managed by Supabase Authentication and is never stored in your profile.</p></section><form id="register-form" class="panel"><h2>Create account</h2><div id="message" class="message" role="status"></div><label>Full name *<input name="full_name" required maxlength="100"></label><label>Student ID *<input name="student_id" required maxlength="40"></label><label>Email address *<input name="email" type="email" required></label><label>Department *<select name="department" required><option value="">Select department</option><option>Computer Science and Engineering</option><option>Artificial Intelligence and Data Science</option><option>Information Technology</option><option>Electronics and Communication Engineering</option><option>Mechanical Engineering</option><option>Civil Engineering</option><option>Other</option></select></label><label>Degree / course *<input name="course" required placeholder="e.g. B.Tech CSE (AI)"></label><label>Academic year *<select name="academic_year" required><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>Other</option></select></label><label>Phone (optional)<input name="phone" type="tel"></label><div class="twocol"><label>Password *<input name="password" type="password" minlength="8" required></label><label>Confirm password *<input name="confirm_password" type="password" minlength="8" required></label></div><label class="check"><input name="privacy" type="checkbox" required> I have read the <a href="privacy.html">privacy notice</a>.</label><button class="btn full" type="submit">Create account</button><p class="center muted">Already registered? <a href="login.html">Sign in</a></p></form></main></body></html>
